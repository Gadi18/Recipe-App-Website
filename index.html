<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipePro – Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #fff8f2 100%);
      color: #2d2d2d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #1e88e5;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 1.2rem;
      color: #666;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-block;
      background: #1e88e5;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 50px;
      margin-bottom: 48px;
      letter-spacing: 0.5px;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      max-width: 700px;
      margin-bottom: 48px;
    }

    .feature {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      width: 170px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .feature:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(30, 136, 229, 0.15);
    }

    .feature .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .feature p {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.4;
    }

    .contact {
      font-size: 0.9rem;
      color: #999;
      margin-top: 40px;
    }

    .contact a {
      color: #1e88e5;
      text-decoration: none;
      font-weight: 500;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .feature {
        width: 150px;
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="emoji">🍳</div>
  <h1>RecipePro</h1>
  <p class="tagline">Your recipe companion for scaling and costing. Coming soon to iOS & Android.</p>
  <div class="badge">🚀 Launching Soon</div>

  <div class="features">
    <div class="feature">
      <div class="icon">📐</div>
      <p>Smart Recipe Scaling</p>
    </div>
    <div class="feature">
      <div class="icon">💰</div>
      <p>Food Cost Tracking</p>
    </div>
    <div class="feature">
      <div class="icon">📚</div>
      <p>Recipe Organization</p>
    </div>
    <div class="feature">
      <div class="icon">📸</div>
      <p>AI Recipe Scanner</p>
    </div>
  </div>

  <div class="contact">
    <p>Questions? <a href="mailto:hello@recipepro.app">Get in touch</a></p>
  </div>

</body>
</html>
